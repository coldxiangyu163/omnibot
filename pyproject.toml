[project]
name = "omnibot"
version = "0.1.0"
description = "Production-ready AI chatbot framework with RAG and multi-channel support"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.5.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
    "pypdf>=4.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.24"]
